<!-- FATH build v17 2026-10-30 -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<link rel="manifest" href="manifest.json">
<title>FATH — фитнес-игра</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
.pixel-ui{font-family:'Press Start 2P','Courier New',monospace;}
.pixel-ui .card,.pixel-ui .btn,.pixel-ui .modal,.pixel-ui input,.pixel-ui select,.pixel-ui .tag,.pixel-ui .chip{border-radius:0 !important;}
.pixel-ui .card{box-shadow:4px 4px 0 rgba(0,255,204,.3);}
.pixel-ui .btn{box-shadow:3px 3px 0 rgba(0,255,204,.4);}
.pixel-ui .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,255,204,.4);}
.pixel-ui h1,.pixel-ui h2,.pixel-ui h3{letter-spacing:1px;}
.pixel-ui::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);}
.pixel-ui::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9998;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.55) 100%);}


/* NEWS GLOW — газета светится, пока выпуск не прочитан */
@keyframes newsGlow{0%,100%{box-shadow:0 0 10px rgba(255,209,102,.35),inset 0 0 8px rgba(255,209,102,.08);filter:brightness(1)}50%{box-shadow:0 0 26px rgba(255,209,102,.9),0 0 44px rgba(255,160,60,.45),inset 0 0 14px rgba(255,209,102,.16);filter:brightness(1.22)}}
.news-new{animation:newsGlow 1.6s ease-in-out infinite;border-color:#ffd166 !important}
.news-new .ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,209,102,.85);pointer-events:none;opacity:0;animation:ffFloat 4.2s ease-in-out infinite}
.news-new .sp{position:absolute;color:#fff3c4;text-shadow:0 0 6px rgba(255,209,102,.9);font-size:11px;pointer-events:none;opacity:0;animation:spTw 2.6s ease-in-out infinite}
@keyframes ffFloat{0%{opacity:0;transform:translate(0,0)}12%{opacity:.95}45%{opacity:.35;transform:translate(14px,-16px)}85%{opacity:.9;transform:translate(26px,-30px)}100%{opacity:0;transform:translate(30px,-38px)}}
@keyframes spTw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(95deg)}}
/* QUAKE */
.quake-ui #app{animation:qShake .6s infinite}
.quake-ui .card,.quake-ui header{animation:qJit .5s infinite}
.quake-ui .card:nth-child(2n){animation-delay:.13s}
.quake-ui .card:nth-child(3n){animation-delay:.27s}
@keyframes qShake{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,0)}75%{transform:translate(0,1px)}}
@keyframes qJit{0%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}50%{transform:translate(-.7px,.5px)}75%{transform:translate(.5px,.7px)}100%{transform:translate(0,0)}}
.quake-ui .btn{position:relative}
.quake-ui .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 10px,rgba(0,0,0,.22) 10px 11px,transparent 11px 26px);opacity:.55}
/* DRUNK */
.drunk-ui .card{animation:dWob 4.6s ease-in-out infinite}
.drunk-ui .card:nth-child(2n){animation-delay:-1.2s}
.drunk-ui .card:nth-child(3n){animation-delay:-2.4s}
.drunk-ui .card:nth-child(5n){animation-delay:-3.1s}
@keyframes dWob{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.3deg) translateY(3px)}}
.drunk-ui .btn:nth-child(2n){transform:rotate(-2deg)}
.drunk-ui .btn:nth-child(3n){transform:rotate(2.5deg)}
.drunk-ui .hlogo{display:inline-block;animation:dWob 3s ease-in-out infinite}
/* DEEP */
.deep-ui .card{animation:dBob 7s ease-in-out infinite}
.deep-ui .card:nth-child(2n){animation-delay:-2s}
.deep-ui .card:nth-child(3n){animation-delay:-4s}
@keyframes dBob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
/* MAGMA */
.magma-ui .card{box-shadow:0 4px 18px rgba(255,90,26,.16),0 0 0 1px rgba(255,120,40,.14)}
.magma-ui .btn.prim{box-shadow:0 0 16px rgba(255,90,26,.45)}
.magma-ui .hlogo{text-shadow:0 0 12px rgba(255,90,26,.7)}
/* FROST */
.frost-ui .card{border:1px solid rgba(170,225,255,.4);box-shadow:0 0 14px rgba(120,210,255,.18),inset 0 0 18px rgba(160,220,255,.06)}
.frost-ui .hlogo{text-shadow:0 0 10px rgba(150,225,255,.8)}
/* CANDY */
.candy-ui .card{border-radius:24px;border:2px solid rgba(255,170,215,.45);box-shadow:0 6px 0 rgba(255,110,180,.3),0 10px 24px rgba(255,110,180,.12)}
.candy-ui .btn{border-radius:999px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 7px,transparent 7px 14px)}
.candy-ui .btn.prim{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 7px,transparent 7px 14px)}
.candy-ui .hlogo{letter-spacing:2px}
/* UFO */
.ufo-ui .hlogo,.ufo-ui h3{animation:ufGl 2.8s infinite}
@keyframes ufGl{0%,88%,100%{text-shadow:none}90%{text-shadow:2px 0 #4dff6a,-2px 0 #0ff}94%{text-shadow:-2px 0 #4dff6a,2px 0 #0ff}}
.ufo-ui .btn.prim{box-shadow:0 0 14px rgba(77,255,106,.5)}
.ufo-ui .card{border:1px solid rgba(77,255,106,.3);box-shadow:0 0 12px rgba(77,255,106,.12)}
/* TOPKAPI — дворец: золото, мрамор, пульсирующие кнопки */
.topkapi-ui .card{border:1px solid rgba(255,217,138,.35);border-radius:16px 16px 4px 4px;box-shadow:0 0 16px rgba(255,200,110,.16),inset 0 0 22px rgba(255,190,90,.05);background-image:linear-gradient(180deg,rgba(255,220,150,.06),transparent 55%)}
.topkapi-ui .btn{border-radius:12px 12px 3px 3px;background-image:linear-gradient(180deg,rgba(255,220,150,.16),rgba(255,220,150,0))}
.topkapi-ui .btn.prim{animation:tkPulse 3.2s ease-in-out infinite}
@keyframes tkPulse{0%,100%{box-shadow:0 0 12px rgba(255,205,115,.35)}50%{box-shadow:0 0 24px rgba(255,205,115,.65)}}
.topkapi-ui .hlogo{text-shadow:0 0 14px rgba(255,210,120,.85);letter-spacing:2.5px}
.topkapi-ui h3{text-shadow:0 1px 0 rgba(255,200,110,.3);border-bottom:2px solid rgba(255,205,115,.35);padding-bottom:5px}
.topkapi-ui header{background:linear-gradient(180deg,rgba(40,26,12,.78),rgba(20,14,8,.72));border-bottom:2px solid rgba(255,205,115,.25)}
.topkapi-ui .pill{border:1px solid rgba(255,217,138,.3)}
/* HAREM — гарем: багрянец, мерцание карточек, арочные углы */
.harem-ui .card{border:1px solid rgba(255,143,176,.35);border-radius:26px 26px 10px 10px;background-image:linear-gradient(180deg,rgba(255,140,180,.07),transparent 50%);box-shadow:0 0 14px rgba(255,120,170,.12)}

.harem-ui .btn{border-radius:999px 999px 14px 14px}
.harem-ui .btn.prim{box-shadow:0 0 18px rgba(255,133,170,.5)}
.harem-ui .hlogo{font-style:italic;text-shadow:0 0 12px rgba(255,140,180,.8)}
.harem-ui header{background:linear-gradient(180deg,rgba(58,10,32,.78),rgba(30,8,20,.72))}
/* BOSPHOR — ночной Стамбул: холодное бирюзовое свечение, волны */
.bosphor-ui .card{border:1px solid rgba(74,200,255,.3);border-radius:6px;box-shadow:0 0 14px rgba(74,200,255,.13),inset 0 0 18px rgba(60,160,255,.05);background-image:linear-gradient(180deg,rgba(74,200,255,.06),transparent 40%)}
.bosphor-ui header{background:linear-gradient(180deg,rgba(4,14,36,.8),rgba(2,8,22,.72));border-bottom:1px solid rgba(74,200,255,.35)}
.bosphor-ui .pill{animation:bsBob 6s ease-in-out infinite}
.bosphor-ui .pill:nth-child(2n){animation-delay:-2s}
.bosphor-ui .pill:nth-child(3n){animation-delay:-4s}
@keyframes bsBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.bosphor-ui .hlogo{text-shadow:0 0 12px rgba(74,200,255,.85)}
.bosphor-ui .btn.prim{box-shadow:0 0 16px rgba(74,200,255,.45)}
/* SORRY GLITCH — фон-компенсация: живой, но всё кликабельно */
.sorry-ui .card{animation:srJit 3.6s infinite;position:relative}
.sorry-ui .card:nth-child(2n){animation-delay:-.7s}
.sorry-ui .card:nth-child(3n){animation-delay:-1.9s}
.sorry-ui .btn{animation:srJit 2.9s infinite}
.sorry-ui .btn:nth-child(2n){animation-delay:-.9s}
.sorry-ui nav{animation:srJit 4.2s infinite}
.sorry-ui header{animation:srJit 3.8s infinite}
.sorry-ui .hlogo,.sorry-ui h3{animation:srGl 4.6s infinite}
.sorry-ui .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,59,107,.045) 0 2px,transparent 2px 5px)}
.sorry-ui .btn.prim{box-shadow:0 0 14px rgba(255,59,107,.5)}
@keyframes srJit{0%,91%,100%{transform:none;filter:none}93%{transform:translate(1px,-1px) skewX(.5deg);filter:hue-rotate(25deg) brightness(1.12)}95%{transform:translate(-1px,0)}97%{transform:translate(.5px,.5px) skewX(-.4deg)}}
@keyframes srGl{0%,87%,100%{text-shadow:none}89%{text-shadow:2px 0 #ff3b6b,-2px 0 #2de2e6}92%{text-shadow:-2px 0 #ff3b6b,2px 0 #2de2e6}94%{text-shadow:1px 0 #ff3b6b,-1px 0 #2de2e6}}

/* BAKALA v4 — кровавая тема UI: жёсткие переопределения (работают при любых настройках), всё статично */
.bakala-ui{--bg:#0a0104}
.bakala-ui .card{background:linear-gradient(180deg,rgba(48,4,12,.93),rgba(22,1,6,.9)) !important;border:1px solid rgba(255,36,60,.5) !important;box-shadow:0 6px 22px rgba(90,0,10,.5),0 0 0 1px rgba(255,36,60,.22),inset 0 0 22px rgba(120,0,14,.22) !important;color:#ffd8d8 !important;position:relative}
.bakala-ui .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(150,0,20,.1),transparent 55%)}
.bakala-ui .card h3{color:#ffe2e2;text-shadow:0 0 12px rgba(255,32,56,.55);border-bottom:1px solid rgba(255,36,60,.3);padding-bottom:5px}
.bakala-ui .card .sub,.bakala-ui .tag,.bakala-ui .muted{color:rgba(255,170,175,.8) !important}
.bakala-ui header{background:linear-gradient(180deg,rgba(46,2,12,.95),rgba(14,0,5,.92)) !important;border-bottom:1px solid rgba(255,32,56,.55) !important}
.bakala-ui .hlogo{background:linear-gradient(135deg,#ff2038,#ff7a4d) !important;-webkit-background-clip:text !important;background-clip:text !important;text-shadow:0 0 14px rgba(255,32,56,.65)}
.bakala-ui nav{background:linear-gradient(180deg,rgba(30,2,9,.96),rgba(10,0,4,.92)) !important;border-top:1px solid rgba(255,32,56,.45) !important}
.bakala-ui .navbtn{color:rgba(255,150,150,.85) !important;background:rgba(40,3,12,.7) !important}
.bakala-ui .navbtn.on{background:linear-gradient(135deg,#8f1124,#c11a30) !important;color:#ffe0e0 !important;box-shadow:0 0 16px rgba(255,32,56,.55) !important;border:1px solid rgba(255,90,110,.6) !important}
.bakala-ui .btn{background:linear-gradient(180deg,rgba(78,6,18,.92),rgba(44,2,10,.92)) !important;border:1px solid rgba(255,60,80,.45) !important;color:#ffd6d6 !important;box-shadow:0 2px 10px rgba(90,0,12,.4) !important}
.bakala-ui .btn.prim{background:linear-gradient(135deg,#9c1329,#c62036) !important;color:#fff !important;box-shadow:0 0 18px rgba(255,32,56,.6) !important;border-color:rgba(255,110,125,.7) !important}
.bakala-ui .btn:active{background:linear-gradient(180deg,rgba(150,16,34,.95),rgba(70,4,16,.95)) !important}
.bakala-ui .pill{background:rgba(60,4,14,.9) !important;border:1px solid rgba(255,60,80,.4) !important;color:#ffd0d0 !important}
.bakala-ui .chip{background:rgba(60,4,14,.85) !important;border:1px solid rgba(255,60,80,.4) !important}
.bakala-ui .chip.sel{background:linear-gradient(135deg,#9c1329,#c62036) !important;color:#fff !important;border-color:rgba(255,110,125,.7) !important}
.bakala-ui .stat{background:rgba(58,4,14,.85) !important;border:1px solid rgba(255,60,80,.3) !important}
.bakala-ui .bar{background:rgba(110,12,24,.5) !important}
.bakala-ui input,.bakala-ui select,.bakala-ui textarea{background:rgba(60,4,14,.8) !important;border:1px solid rgba(255,60,80,.4) !important;color:#ffd8d8 !important}
.bakala-ui main{background:linear-gradient(180deg,rgba(20,0,6,.35),rgba(10,0,4,.5))}

:root{
  --bg:#0d0d14;--panel:rgba(30,30,48,.72);--panel2:rgba(44,44,70,.6);
  --fg:#f2f2fa;--muted:#9a9ab8;--border:rgba(255,255,255,.09);
  --acc1:#7c4dff;--acc2:#448aff;--grad:linear-gradient(135deg,#7c4dff,#448aff);
  --good:#4caf7d;--bad:#ff5c6c;--warn:#ffb74d;
}
body.light{--bg:#f2f3f8;--panel:rgba(255,255,255,.85);--panel2:rgba(245,246,252,.9);
  --fg:#1a1a2e;--muted:#666a8a;--border:rgba(20,20,60,.1);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;
  font-size:15px;overflow:hidden}
#bgc{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:10px 14px 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--thbg,rgba(0,0,0,.25));backdrop-filter:blur(14px);border-bottom:1px solid var(--tborder,var(--border))}
.hlogo{font-weight:800;font-size:20px;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.pill{background:var(--tpanel2,var(--panel));border:1px solid var(--tborder,var(--border));border-radius:20px;
  padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill b{font-size:14px}
#xpwrap{flex:1 1 100%;height:6px;border-radius:4px;background:rgba(128,128,160,.18);overflow:hidden}
#xpbar{height:100%;background:var(--grad);width:0%;transition:width .4s}
main{flex:1;overflow-y:auto;padding:12px 12px 18px;scrollbar-width:thin}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:var(--tnbg,rgba(0,0,0,.3));backdrop-filter:blur(14px);border-top:1px solid var(--tborder,var(--border))}
nav::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-family:inherit;
  font-size:15.5px;padding:12px 16px;border-radius:16px;cursor:pointer;white-space:nowrap}
.navbtn.on{background:var(--tgrad,var(--grad));color:var(--tfg,#fff);font-weight:700;box-shadow:var(--tbtnshadow,none)}
.card{background:var(--tpanel,var(--panel));border:1px solid var(--tborder,var(--border));border-radius:18px;
  padding:14px;margin-bottom:12px;backdrop-filter:blur(10px);box-shadow:var(--tcardshadow,0 4px 18px rgba(0,0,0,.18));color:var(--tfg,var(--fg))}
.card h3{font-size:16px;margin-bottom:8px}
.card .sub{color:var(--muted);font-size:12.5px;line-height:1.45;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:14px;padding:10px 16px;font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer;background:var(--tpanel2,var(--panel2));color:var(--tfg,var(--fg));
  border:1px solid var(--tborder,var(--border));transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.prim{background:var(--tgrad,var(--grad));color:#fff;border:none;box-shadow:var(--tbtnshadow,0 4px 14px rgba(124,77,255,.35))}
.btn.danger{background:rgba(255,92,108,.15);color:var(--bad);border:1px solid rgba(255,92,108,.35)}
.btn.good{background:rgba(76,175,125,.15);color:var(--good);border:1px solid rgba(76,175,125,.35)}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
input,select,textarea{background:rgba(128,128,160,.12);border:1px solid var(--border);
  color:var(--fg);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;width:100%}
input:focus,select:focus{outline:1px solid var(--acc2)}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--panel2);
  border:1px solid var(--border);border-radius:12px;padding:5px 10px;font-size:12px}
.chip.sel{background:var(--tchipon,var(--grad));color:#fff;border:none;font-weight:600}
.bar{height:9px;border-radius:6px;background:rgba(128,128,160,.18);overflow:hidden}
.bar>div{height:100%;background:var(--grad);border-radius:6px;transition:width .4s}
.hpbar>div{background:linear-gradient(90deg,#ff3b3b,#ff8a80)}
.xpbar>div{background:linear-gradient(90deg,#42a5f5,#1565c0)}
#xpbar{background:linear-gradient(90deg,#42a5f5,#1565c0)}
.stat{flex:1;min-width:70px;background:rgba(128,128,160,.1);border-radius:14px;padding:9px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:10px 18px;
  border-radius:16px;font-size:14px;opacity:0;transition:.3s;z-index:50;pointer-events:none;
  max-width:88vw;text-align:center;backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#errbox{display:none;position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;
  padding:6px 12px;font-size:11.5px;z-index:99;word-break:break-all}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#modal .mbox{background:var(--panel);border:1px solid var(--border);border-radius:22px 22px 0 0;
  padding:20px;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;animation:mup .25s}
@keyframes mup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.mclose{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.pill-r{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700}
.r-common{background:rgba(150,160,170,.2);color:#a9b4bd}
.r-rare{background:rgba(68,138,255,.2);color:#6ea8ff}
.r-epic{background:rgba(156,89,182,.25);color:#c98af0}
.r-legendary{background:rgba(241,196,15,.22);color:#ffd94d}
.r-mythic{background:rgba(0,229,255,.18);color:#7ff3ff;box-shadow:0 0 10px rgba(0,229,255,.35);animation:mythPulse 2s ease-in-out infinite}
@keyframes mythPulse{0%,100%{box-shadow:0 0 6px rgba(0,229,255,.3)}50%{box-shadow:0 0 16px rgba(255,215,0,.45)}}
.wheelbox{position:relative;width:min(88vw,340px);height:min(88vw,340px);margin:6px auto 10px}
.wheelbox canvas{width:100%;height:100%}
.wpn{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:26px;z-index:2}
.big{font-size:30px;font-weight:800}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:10px;border-radius:14px;background:rgba(128,128,160,.08);margin-bottom:8px}
li{margin:4px 0 4px 18px}
.small{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left}
.tag{font-size:11px;color:var(--muted)}
canvas.fx{width:100%;height:220px;border-radius:14px;background:rgba(0,0,0,.3);display:block}
body.neon-ui .card{border-color:rgba(0,240,255,.5);box-shadow:0 0 18px rgba(0,240,255,.25),0 0 34px rgba(255,0,224,.18)}
body.neon-ui h1,body.neon-ui h2,body.neon-ui h3{color:#e8f8ff;text-shadow:0 0 10px #00f0ff,0 0 26px rgba(0,240,255,.6)}
body.neon-ui .chip{border-color:rgba(0,240,255,.4)}
body.neon-ui .chip.sel{background:rgba(0,240,255,.15);border-color:#00f0ff;box-shadow:0 0 12px rgba(0,240,255,.6);color:#e8f8ff;text-shadow:0 0 8px #00f0ff}

function tierMul(n){for(var i=0;i<TIERS.length;i++)if(n<=TIERS[i][0])return TIERS[i][1];return 0.3;}
function tierProg(n){var rem=n,out=0,lo=0;for(var i=0;i<TIERS.length;i++){var cap=TIERS[i][0],mul=TIERS[i][1];var seg=Math.min(rem,cap-lo);if(seg>0){out+=seg*mul;rem-=seg;}lo=cap;}if(rem>0)out+=rem*0.3;return Math.round(out);}

  if(p.lvl===50){STATE.artgold=STATE.artgold||{};
    if(!STATE.artgold[p.sp]){STATE.artgold[p.sp]=1;toast("🔨 "+ARTFACTS[p.sp].n+" перекован в пепельный: +15% ко всем цифрам!");}}}
function petAddXp(n){
  var p=STATE.pets[STATE.activepet];if(!p)return;
  var _tb=trBonus().op;if(_tb)n=Math.round(n*(1+_tb/100));
  p.xp+=n;
  while(p.lvl<50&&p.xp>=petNeed(p.lvl)){p.xp-=petNeed(p.lvl);p.lvl++;
    if(p.lvl===10)toast("✨ "+PETMAP[p.sp][1]+" — эво-способность!");

}
function petSubXp(n){n=Math.max(0,Math.floor(n));var p=STATE.pets[STATE.activepet];if(!p||!n)return;

}
// ===== ЯЩИКИ =====
var EGGCH={wood:0.10,silver:0.13,gold:0.17,legendary:0.20};
var DUPS={common:30,rare:75,epic:180,legendary:400,mythic:1000};
function openBox(kind,free){
  var t=BOXTYPES[kind];if(!t)return;
  if(!free){if(STATE.tok<t.price){toast("🪙 Не хватает жетонов");return;}addTok(-t.price);}
  S("box");
  if(STATE.week&&typeof STATE.week==="object"&&!Array.isArray(STATE.week))STATE.week.boxes=(STATE.week.boxes||0)+1;
  var rar=BOXPOOLS[kind][Math.floor(Math.random()*BOXPOOLS[kind].length)];
  var roll=Math.random();
  if(roll<EGGCH[kind]){
    var pool=PETS.filter(function(p){return p[2]===rar;}).map(function(p){return p[0];});
    if(pool.length){
      var sp=pool[Math.floor(Math.random()*pool.length)];
      var dup=STATE.pets.some(function(pp){return pp.sp===sp;});
      if(dup){S("dup");var tok=DUPS[rarOf(sp)];addTok(tok);
        showBoxResult(kind,"🐾 Дубликат!",PETMAP[sp][3]+" "+PETMAP[sp][1]+" уже есть → +"+tok+" 🪙");}
      else{S("newpet");if(!STATE.petuid)STATE.petuid=0;STATE.petuid++;var np={sp:sp,lvl:1,st:1,xp:0,hp:0,id:"p"+STATE.petuid};np.hp=petStats(np).hp;STATE.pets.push(np);
        showBoxResult(kind,"🐾 Новый питомец!",PETMAP[sp][3]+" "+PETMAP[sp][1]+" ("+rqr(rar).n+") — смотри вкладку Питомцы");}
      STATE.boxhist++;checkAch();save();return;
    }
  }
  var _gr=GIRLRAR[rar];
  if(_gr&&Math.random()<_gr){
    var gpool=GIRLS.filter(function(g){return g.rar===rar;});
    if(gpool.length){
      var g2=gpool[Math.floor(Math.random()*gpool.length)];
      if(STATE.girls[g2.id]){S("dup");addTok(GIRLDUPS[g2.rar]);
        showBoxResult(kind,"💃 Дубликат!",g2.ic+" "+g2.n+" уже в гареме → +"+GIRLDUPS[g2.rar]+" 🪙");}
      else{S("newpet");STATE.girls[g2.id]=1;
        showBoxResult(kind,"💃 Новая девушка!",g2.ic+" "+g2.n+" ("+rqr(rar).n+") вступила в гарем!");}
      STATE.boxhist++;checkAch();save();return;
    }
  }
  if(KOSEMCH[kind]&&Math.random()<KOSEMCH[kind]){
    var _kg=GIRLMAP["kosem"];
    if(STATE.girls[_kg.id]){S("dup");addTok(GIRLDUPS.mythic);
      showBoxResult(kind,"💃 Дубликат!",_kg.ic+" "+_kg.n+" уже в гареме → +"+GIRLDUPS.mythic+" 🪙");}
    else{S("newpet");STATE.girls[_kg.id]=1;
      showBoxResult(kind,"💃 Легенда гарема!",_kg.ic+" "+_kg.n+" (Мифическая) вступила в гарем!");}
    STATE.boxhist++;checkAch();save();return;
  }
  if(!STATE.ownedbg)STATE.ownedbg=[];else if(!STATE.ownedbg.includes)STATE.ownedbg=Object.keys(STATE.ownedbg);var bgk=Object.keys(BACKGROUNDS).filter(function(k){return STATE.ownedbg.indexOf(k)<0;}).filter(function(k){return !PROMO_BGS[k];});if(bgk.length&&Math.random()<({wood:0.2,silver:0.3,gold:0.4,legendary:0.55})[kind]){var wbg=bgk[Math.floor(Math.random()*bgk.length)];STATE.ownedbg.push(wbg);S("newpet");showBoxResult(kind,"🌌 Новый фон!","«"+BACKGROUNDS[wbg].n+"» ("+RAR[BACKGROUNDS[wbg].r].n+") — смотри Настройки");STATE.boxhist++;checkAch();save();return;}
  var styles=BOXSTYLES.filter(function(s){return s[2]===rar&&STATE.owned.indexOf(s[0])<0;});
  if(!styles.length)styles=BOXSTYLES.filter(function(s){return s[2]===rar;});
  if(!styles.length){
    var tok2=[30,75,180,400][RARORDER.indexOf(rar)];addTok(tok2);
    showBoxResult(kind,"Все стили есть","Стили редкости "+rqr(rar).n+" уже получены → +"+tok2+" 🪙");
  }else{
    var st=styles[Math.floor(Math.random()*styles.length)];
    STATE.owned.push(st[0]);
    showBoxResult(kind,"🎨 Новый стиль!",ALLSTYLES[st[0]]+" ("+rqr(rar).n+") — смотри Магазин");
  }
  var tk1=t.tk[0]+Math.floor(Math.random()*(t.tk[1]-t.tk[0]+1));
  if(upgL("dbl")&&Math.random()<0.10*upgL("dbl")){tk1*=2;toast("✨ Двойное вскрытие: жетоны ×2!");}
  addTok(tk1);
  if(upgL("wave")&&Math.random()<0.04*upgL("wave")){toast("🌊 Золотая волна: ещё один ящик!");setTimeout(function(){openBox(kind,true);},900);}
  STATE.boxhist++;checkAch();save();
}
function showBoxResult(kind,title,text){
  var t=BOXTYPES[kind];
  openModal('<div style="text-align:center"><div style="font-size:60px">'+t.icon+'</div>'+
  '<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+
  '<button class="btn prim" onclick="closeModal()">Забрать</button></div>');
}

        ctx.beginPath();ctx.arc(cx,cy+10,7,0,7);ctx.fill();}
      if(t<=0.9)label(x,y-8,nameAt(i),"rgba(255,255,255,.7)");}
    if(t>0.9){label(cx,cy-16,nameAt(target),"#ffd600",true);hi(true,cx,cy+10,18);}
    break;}
  // ===== ФЕЙЕРВЕРК =====
  case "firework":{
    var ltt=Math.min(1,t*2.4);
    var ry2=H*(1-ltt*0.7);var rx2=W/2+Math.sin(t*4)*20;
    if(t<0.45){ctx.strokeStyle="rgba(255,220,120,.8)";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(rx2,ry2);ctx.lineTo(rx2,ry2+18);ctx.stroke();}
    if(t>0.42){
      var ex3=(t-0.42)/0.58;
      for(i=0;i<n;i++){ang=i*2*Math.PI/n+t*2;
        var ddd=RR*1.05*(1-Math.pow(1-ex3,2.2));
        x=cx+Math.cos(ang)*ddd;y=cy-RR*0.15+Math.sin(ang)*ddd;
        var sel=t>0.9&&i===target;
        ctx.fillStyle=sel?"#ffd600":col(i);
        ctx.globalAlpha=0.9-ex3*0.35;
        ctx.beginPath();ctx.arc(x,y,sel?8:3.5,0,7);ctx.fill();
        ctx.globalAlpha=1;
        label(x,y-10,nameAt(i),sel?"#ffd600":"rgba(255,255,255,.75)");
        if(sel)hi(true,x,y,12);}}
    break;}
  // ===== ПОРТАЛ =====
  case "portal":{
    for(k=6;k>=1;k--){
      var pr2=((t*1.5+k/6)%1);
      ctx.strokeStyle="hsla("+(270+k*15)%360+",95%,65%,"+(0.6*(1-pr2))+")";
      ctx.lineWidth=3.5-k*0.4;
      ctx.beginPath();ctx.arc(cx,cy,RR*pr2*1.15,0,7);ctx.stroke();}
    var pg=ctx.createRadialGradient(cx,cy,0,cx,cy,RR*0.3);
    pg.addColorStop(0,"rgba(255,255,255,.95)");pg.addColorStop(1,"rgba(124,77,255,0)");
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx,cy,RR*0.3,0,7);ctx.fill();

  // ===== РОГАТКА =====

    ctx.beginPath();ctx.moveTo(W*0.5,H*0.85);ctx.lineTo(W*0.5+14,H*0.7);ctx.stroke();
    var pull=Math.max(0,0.9-t)/0.9;
    var px4=W*0.5,py4=H*0.7+18*(1-t*1.1);
    ctx.strokeStyle="#664422";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W*0.5-14,H*0.7);ctx.lineTo(px4,py4);ctx.lineTo(W*0.5+14,H*0.7);ctx.stroke();
    var fl=Math.min(1,t*1.3);

    break;}
  // ===== РУЛЕТКА =====

      ctx.fillText(nameAt(i).slice(0,10),0,0);ctx.restore();}

      var wa=ra0+(target+0.5)*2*Math.PI/n;
      ctx.strokeStyle="#ffd600";ctx.lineWidth=5;ctx.shadowColor="#ffd600";ctx.shadowBlur=14;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,RR,ra0+target*2*Math.PI/n,ra2=ra0+(target+1)*2*Math.PI/n);ctx.closePath();ctx.stroke();
      ctx.restore();ctx.globalAlpha=1;}
    ctx.beginPath();ctx.arc(cx,cy,RR*0.14,0,7);ctx.fillStyle="#c9a227";ctx.fill();
    break;}
  default:{
    // запасной сценарий — обычное колесо
    var dspin=6.5*Math.pow(1-t,3)+0.2;var da0=-Math.PI/2-dspin*2*Math.PI;
    for(i=0;i<n;i++){var da1=da0+i*2*Math.PI/n,da2=da0+(i+1)*2*Math.PI/n;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,RR,da1,da2);ctx.closePath();
      ctx.fillStyle=col(i);ctx.globalAlpha=0.85;ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle="rgba(255,255,255,.25)";ctx.stroke();}
    break;}
  }
  // финальная подпись победителя
  if(t>=0.9&&style!=="crystal"&&style!=="matrix"&&style!=="portal"){
    var wn=nameAt(target);
    ctx.save();
    var banner=Math.min(1,(t-0.9)/0.1);

    ctx.fillStyle="rgba(0,0,0,.55)";
    roundRect(ctx,cx-80,H-38,160,26,13);ctx.fill();
    ctx.fillStyle="#ffd600";ctx.font="bold 14px sans-serif";ctx.textAlign="center";
    ctx.fillText("★ "+wn,cx,H-20);
    ctx.restore();}
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function calcCal(){
  var w=parseFloat(document.getElementById("cl_w").value)||0;
  var hh=parseFloat(document.getElementById("cl_h").value)||0;
  var a=parseFloat(document.getElementById("cl_a").value)||0;
  var s=document.getElementById("cl_s").value;
  var act=parseInt(document.getElementById("cl_act").value)||0;
  if(!w||!hh||!a){toast("Заполни вес, рост и возраст");return;}
  var bmr=10*w+6.25*hh-5*a+(s==="m"?5:-161);
  var mult=[1.2,1.375,1.55,1.725][act]||1.2;
  STATE.cal={w:w,h:hh,a:a,s:s,act:act,norm:Math.round(bmr*mult),eaten:STATE.cal.eaten||[],goal:STATE.cal.goal||null,water:STATE.cal.water||{},burn:STATE.cal.burn||null};
  save();render();toast("Норма: "+STATE.cal.norm+" ккал");
}
function findFood(q){
  q=q.toLowerCase().replace(/\s+/g,' ');
  var exact=null,parts=[];
  FOODS.forEach(function(f){
    var n=f[0].toLowerCase();
    if(n===q)exact=f;
    else if(n.indexOf(q)>=0||q.indexOf(n)>=0)parts.push(f);
  });
  if(exact)return[exact];
  return parts.slice(0,8);
}

function burnUnitsFor(kcal,ex){
  var f=KCAL[ex];if(!f)return 0;

  if(ex==="steps")return Math.max(10,Math.round(u/10)*10);
  return Math.max(1,Math.round(u));
}

function farmDateAdd(s,n){var a=s.split("-"),d=new Date(+a[0],+a[1]-1,+a[2]);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

 if(STATE.farm&&STATE.farm.on)return;
 STATE.farm={on:1,lvl:1,xp:0,tot:0,plots:[null,null,null,null],seed:{wheat:1,carrot:1,apple:0,pumpkin:0},store:{},upg:{lake:0,green:0,comp:0,stall:0},waterLeft:2,day:todayStr(),buffD:null,buffC:null};
 if(!silent)toast("🌱 На панели появилась новая вкладка");

function farmUpgL(k){return farmOn()?(STATE.farm.upg[k]||0):0;}
function farmMaxPlots(){return 3+((STATE.farm&&STATE.farm.lvl)||1);}
function farmLvlUp(){
 var f=STATE.farm;
 while(f.lvl<FARMLVL.length&&f.xp>=FARMLVL[f.lvl]){
  f.lvl++;
  while(f.plots.length<farmMaxPlots())f.plots.push(null);
  toast("🌱 Участок разросся: уровень "+f.lvl+" (грядок: "+farmMaxPlots()+")");
 }
}
function farmDayTick(){
 if(!farmOn())return;
 var f=STATE.farm,t=todayStr();
 if(!f.day)f.day=t;
 var guard=0;
 while(f.day<t&&guard<40){
  guard++;
  var prev=f.day;
  f.waterLeft=2+farmUpgL("lake");
  f.plots.forEach(function(pl){
   if(!pl||pl.ready)return;
   var c=CROPS[pl.sp],need=Math.max(1,c.days-farmUpgL("green"));
   pl.prog+=(pl.wd===prev?2:1);
   pl.wd=null;
   if(pl.prog>=need)pl.ready=1;
  });
  if(f.buffD&&f.buffD.day<prev)f.buffD=null;
  if(f.buffC&&f.buffC.day<prev)f.buffC=null;
  f.day=farmDateAdd(prev,1);
 }
 if(f.buffD&&f.buffD.day<t)f.buffD=null;
 if(f.buffC&&f.buffC.day<t)f.buffC=null;
}
function farmBuff(){if(!farmOn())return 0;var f=STATE.farm;return (f.buffD&&f.buffD.day===todayStr())?f.buffD.v:0;}
function farmCoinBuff(){if(!farmOn())return 0;var f=STATE.farm;return (f.buffC&&f.buffC.day===todayStr())?f.buffC.v:0;}
function farmPlant(sp,i){
 if(!farmOn())return;var f=STATE.farm;
 if(!f.seed[sp]||f.plots[i])return;
 f.seed[sp]--;f.plots[i]={sp:sp,prog:0,wd:null,ready:0};
 save();render();
}
function farmWater(i){
 if(!farmOn())return;var f=STATE.farm,pl=f.plots[i];
 if(!pl||pl.ready||f.waterLeft<=0||pl.wd===todayStr())return;
 f.waterLeft--;pl.wd=todayStr();toast("💧 Полито");
 save();render();
}
function farmHarvest(i){
 if(!farmOn())return;var f=STATE.farm,pl=f.plots[i];
 if(!pl||!pl.ready)return;
 var c=CROPS[pl.sp];
 var y=c.ymin+Math.floor(Math.random()*(c.ymax-c.ymin+1));
 y=Math.max(1,Math.round(y*(1+0.1*farmUpgL("comp"))));
 f.store[pl.sp]=(f.store[pl.sp]||0)+y;
 f.xp+=c.xp;f.tot+=y;
 f.plots[i]=null;
 farmLvlUp();
 toast("🌾 "+c.i+" "+c.n+": +"+y+" шт. (всего урожая: "+f.tot+")");
 save();render();
}
function farmBuySeed(sp){
 if(!farmOn())return;var c=CROPS[sp];

 save();render();
}
function farmSell(sp,n){
 if(!farmOn())return;var f=STATE.farm;
 var have=f.store[sp]||0;if(!have)return;
 if(n==="all")n=have;
 n=Math.min(n,have);

 f.store[sp]=have-n;

}

function drawCalChart(){
  var cv=document.getElementById('calchart');if(!cv)return;
  var hist=calChartDays(14);var dpr=window.devicePixelRatio||1;
  var w=cv.clientWidth||320,hh=180;cv.width=w*dpr;cv.height=hh*dpr;
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var vs=hist.map(function(r){return r.v;});var mx=Math.max.apply(null,vs)||1,pad=20;
  function X(i){return pad+(w-2*pad)*i/(hist.length-1);}
  function Y(v){return pad+(hh-2*pad)*(1-v/(mx*1.1));}
  var acc=(getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#4caf50').trim();
  ctx.clearRect(0,0,w,hh);
  ctx.strokeStyle='rgba(128,128,128,.25)';ctx.fillStyle='rgba(128,128,128,.85)';ctx.font='10px sans-serif';
  for(var g=0;g<=4;g++){var v=Math.round(mx*1.1*g/4),y=Y(v);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();ctx.fillText(String(v),2,y-2);}
  ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.beginPath();
  hist.forEach(function(r,i){i?ctx.lineTo(X(i),Y(r.v)):ctx.moveTo(X(i),Y(r.v));});
  ctx.stroke();ctx.fillStyle=acc;
  hist.forEach(function(r,i){if(r.v>0){ctx.beginPath();ctx.arc(X(i),Y(r.v),3,0,7);ctx.fill();}});
  ctx.fillStyle='#fff';
  hist.forEach(function(r,i){if(i%2===0)ctx.fillText(r.d.slice(5),X(i)-12,hh-4);});
}
function drawWeightChart(){
  var cv=document.getElementById('wchart');if(!cv)return;
  var pts=(STATE.bmi.wh||[]).filter(function(r){return r&&r.w>0;});
  if(pts.length<2)return;
  var dpr=window.devicePixelRatio||1;
  var w=cv.clientWidth||320,hh=180;
  cv.width=w*dpr;cv.height=hh*dpr;
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var ws=pts.map(function(r){return r.w;});
  var mn=Math.min.apply(null,ws),mx=Math.max.apply(null,ws);
  var pad=10,span=(mx-mn)||1;
  mn-=span*0.1;mx+=span*0.1;
  function X(i){return pad+(w-2*pad)*i/(pts.length-1);}
  function Y(v){return pad+(hh-2*pad)*(1-(v-mn)/(mx-mn));}
  var acc=(getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#4caf50').trim()||'#4caf50';
  ctx.clearRect(0,0,w,hh);
  ctx.strokeStyle='rgba(128,128,128,.25)';ctx.fillStyle='rgba(128,128,128,.85)';ctx.font='10px sans-serif';
  for(var g=0;g<=4;g++){var v=mn+(mx-mn)*g/4,y=Y(v);
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();
    ctx.fillText(v.toFixed(1),2,y-2);}
  ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.beginPath();
  pts.forEach(function(r,i){i?ctx.lineTo(X(i),Y(r.w)):ctx.moveTo(X(i),Y(r.w));});
  ctx.stroke();
  pts.forEach(function(r,i){ctx.beginPath();ctx.arc(X(i),Y(r.w),3,0,7);ctx.fillStyle=acc;ctx.fill();});
  var diff=pts[pts.length-1].w-pts[0].w;
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';
  ctx.fillText('Δ '+(diff>0?'+':'')+diff.toFixed(1)+' кг',w-72,14);
}

  /* звёзды */
  for(var i=0;i<80;i++){var sx=Math.random()*LW,sy=Math.random()*LH*.5;
    s.globalAlpha=.2+Math.random()*.55;s.fillStyle="rgba(255,230,230,.8)";
    s.beginPath();s.arc(sx,sy,Math.random()*1.1+.3,0,7);s.fill();}
  s.globalAlpha=1;
  /* дальний хребет */
  s.fillStyle="#170309";
  s.beginPath();s.moveTo(0,LH*.6);
  for(var hx=0;hx<=LW;hx+=LW/26){s.lineTo(hx,LH*.6+Math.sin(hx/LW*9)*LH*.022+Math.sin(hx/LW*23+2)*LH*.012);}
  s.lineTo(LW,LH);s.lineTo(0,LH);s.closePath();s.fill();
  /* земля */
  s.fillStyle="#090104";
  s.beginPath();s.moveTo(0,LH*.77);
  for(hx=0;hx<=LW;hx+=LW/16){s.lineTo(hx,LH*.77+Math.sin(hx/LW*6+1)*LH*.014);}
  s.lineTo(LW,LH);s.lineTo(0,LH);s.closePath();s.fill();
  /* надгробия */
  s.fillStyle="rgba(12,1,6,.96)";
  for(i=0;i<5;i++){
    var gx=LW*(.06+Math.random()*.88),gy=LH*(.8+Math.random()*.13),gw=LW*.013+2,gh=LH*.045+Math.random()*LH*.02;
    s.fillRect(gx-gw/2,gy-gh,gw,gh);
    s.fillRect(gx-gw*1.5,gy-gh*.68,gw*3,gw*.7);
  }
  /* мёртвые деревья */
  trees=[];
  for(i=0;i<11;i++){
    var t={x:Math.random()*LW,w:R(2.5,7),h:LH*R(.15,.33),lean:R(-.35,.35),br:[]};
    t.base=LH*(.79+Math.random()*.11);
    var brn=3+(Math.random()*4|0);
    for(var j=0;j<brn;j++)t.br.push({y:R(.3,.85),l:R(.1,.5)*t.h,d:Math.random()<.5?-1:1,a:R(-.3,.35)});
    trees.push(t);
  }
  s.strokeStyle="rgba(3,0,2,.95)";s.lineCap="round";
  trees.forEach(function(t){
    s.lineWidth=t.w;
    s.beginPath();s.moveTo(t.x,t.base);s.quadraticCurveTo(t.x+t.w*t.lean,t.base-t.h*.55,t.x+t.w*t.lean*2,t.base-t.h);s.stroke();
    var tx=t.x+t.w*t.lean*2,ty=t.base-t.h;
    t.br.forEach(function(b){
      var sy=ty+t.h*b.y;
      var ex=tx+b.l*b.d,ey=sy+b.l*(.35+b.a);
      s.lineWidth=Math.max(1.6,b.l*.07);
      s.beginPath();s.moveTo(tx,sy);s.quadraticCurveTo(tx+b.l*b.d*.5,sy+b.l*b.a,ex,ey);s.stroke();
      s.lineWidth=Math.max(1,b.l*.035);
      s.beginPath();s.moveTo(ex,ey);s.lineTo(ex+b.l*.3*b.d,ey+b.l*.28);s.stroke();
    });
  });
  fogs=[];for(i=0;i<5;i++)fogs.push({x:Math.random()*LW,y:LH*R(.64,.9),w:LW*R(.3,.7),v:R(.03,.14),a:R(.04,.09)});
  embers=[];for(i=0;i<30;i++)embers.push({x:Math.random()*LW,y:Math.random()*LH,v:R(.15,.5),r:R(.5,1.9),ph:R(0,6.3)});
}
buildStatic();
window.addEventListener("resize",buildStatic);
/* глаз БАКАЛА — зрачок живёт в кровавой луне */
function drawEye(ts){
  if(!moon.r)return;
  var ex=moon.x,ey=moon.y,ew=moon.r*.82,eh=ew*.52;
  var pulse=.85+.15*Math.sin(ts/900);
  var g=x.createRadialGradient(ex,ey,2,ex,ey,ew*1.7);
  g.addColorStop(0,"rgba(255,30,50,"+(0.3*pulse).toFixed(3)+")");g.addColorStop(1,"rgba(255,30,50,0)");
  x.fillStyle=g;x.beginPath();x.ellipse(ex,ey,ew*1.7,eh*1.7,0,0,7);x.fill();
  if(ts%9000<380){x.fillStyle="rgba(8,0,3,.9)";x.beginPath();x.ellipse(ex,ey,ew,eh,0,0,7);x.fill();return;}
  g=x.createRadialGradient(ex,ey,1,ex,ey,eh);
  g.addColorStop(0,"rgba(255,220,200,.35)");g.addColorStop(.55,"rgba(200,30,40,.22)");g.addColorStop(1,"rgba(110,8,18,.04)");
  x.fillStyle=g;x.beginPath();x.ellipse(ex,ey,ew*.92,eh*.9,0,0,7);x.fill();
  var px=ex+Math.sin(ts/1700)*ew*.2;
  var pr=eh*.4*(1+.12*Math.sin(ts/600));
  g=x.createRadialGradient(px,ey,1,px,ey,pr);
  g.addColorStop(0,"#ff5050");g.addColorStop(.55,"#b40000");g.addColorStop(1,"rgba(90,0,8,0)");
  x.fillStyle=g;x.beginPath();x.arc(px,ey,pr,0,7);x.fill();
  x.fillStyle="rgba(5,0,2,.95)";x.beginPath();x.arc(px,ey,pr*.4,0,7);x.fill();
  x.strokeStyle="rgba(255,60,60,"+(0.5*pulse).toFixed(3)+")";x.lineWidth=1;
  x.beginPath();x.arc(px,ey,pr*.4,0,7);x.stroke();
}
/* духи: лёгкие полупрозрачные призраки с рваным подолом */
var sh=[],next=3500,huntBusy=false,loopOn=false,rafId=0,last=0,lastDraw=0;
function spawn(){
  if(sh.length>=2)return;
  sh.push({x:R(60,LW-60),y:R(110,LH-170),vx:R(-.5,.5),vy:R(-.3,.3),r:R(11,18),life:0,max:R(15000,35000),ph:R(0,6.3)});
}
function drawSpirits(ts,dt){
  x2.clearRect(0,0,LW,LH);
  for(var i=bursts.length-1;i>=0;i--){
    var b=bursts[i];b.t+=dt;
    if(b.t>480){bursts.splice(i,1);continue;}
    var k=b.t/480;
    for(var p=0;p<8;p++){
      var an=p/8*6.283+b.r0,dst=6+k*44;
      var bx=b.x+Math.cos(an)*dst,by=b.y+Math.sin(an)*dst*.7;
      x2.globalAlpha=(1-k)*.85;
      x2.fillStyle=p%2?"#ff2038":"#ff7a5c";
      x2.beginPath();x2.arc(bx,by,3.4*(1-k)+.7,0,7);x2.fill();
    }
    x2.globalAlpha=1;
  }
  for(var i2=sh.length-1;i2>=0;i2--){
    var g=sh[i2];
    g.life+=dt;g.x+=g.vx*dt/16.7;g.y+=g.vy*dt/16.7;
    if(g.x<40||g.x>LW-40)g.vx*=-1;
    if(g.y<90||g.y>LH-150)g.vy*=-1;
    if(g.life>g.max){sh.splice(i2,1);continue;}
    var gy=g.y+Math.sin(ts/520+g.ph)*3;
    var fade=Math.min(1,g.life/800)*Math.min(1,(g.max-g.life)/1400);
    var br=1+.06*Math.sin(ts/460+g.ph);
    var w=g.r*1.05*br,h=g.r*1.5*br;
    var bg=x2.createRadialGradient(g.x,gy-h*.28,1,g.x,gy-h*.28,w*1.7);
    bg.addColorStop(0,"rgba(225,208,222,"+(0.3*fade).toFixed(3)+")");
    bg.addColorStop(.6,"rgba(170,130,150,"+(0.13*fade).toFixed(3)+")");
    bg.addColorStop(1,"rgba(150,110,130,0)");
    x2.fillStyle=bg;
    x2.beginPath();x2.arc(g.x,gy-h*.28,w*1.7,0,7);x2.fill();
    x2.strokeStyle="rgba(240,220,236,"+(0.25*fade).toFixed(3)+")";
    x2.lineWidth=1.1;
    x2.beginPath();
    x2.moveTo(g.x-w*.8,gy-h*.3);
    for(var q=0;q<=8;q++){
      var u=q/8,wx=g.x-w*.8+u*w*1.6;
      var wy=gy-h*.3+u*h*.42+Math.sin(u*9.4+ts/300+g.ph)*3.2;
      x2.lineTo(wx,wy);
    }
    x2.stroke();
    var pu=.6+.4*Math.sin(ts/280+g.ph);
    x2.fillStyle="rgba(255,70,64,"+(0.5*fade*pu).toFixed(3)+")";
    x2.beginPath();x2.arc(g.x-w*.28,gy-h*.44,3,0,7);x2.fill();
    x2.beginPath();x2.arc(g.x+w*.28,gy-h*.44,3,0,7);x2.fill();
    x2.fillStyle="rgba(255,238,228,"+(0.95*fade*pu).toFixed(3)+")";
    x2.beginPath();x2.arc(g.x-w*.28,gy-h*.44,1.1,0,7);x2.fill();
    x2.beginPath();x2.arc(g.x+w*.28,gy-h*.44,1.1,0,7);x2.fill();
    /* дымчатый хвост */
    x2.fillStyle="rgba(200,170,190,"+(0.09*fade).toFixed(3)+")";
    x2.beginPath();x2.arc(g.x-g.vx*22,gy-g.vy*22+8,w*.5,0,7);x2.fill();
  }
}
function drawScene(ts,dt){
  x.clearRect(0,0,LW,LH);
  if(stat)x.drawImage(stat,0,0);
  drawEye(ts);
  fogs.forEach(function(f){
    f.x-=f.v*dt/16.7;if(f.x<-f.w)f.x=LW+f.w*.5;
    var g=x.createLinearGradient(f.x,0,f.x+f.w,0);
    g.addColorStop(0,"rgba(160,20,32,0)");g.addColorStop(.5,"rgba(160,20,32,"+f.a.toFixed(3)+")");g.addColorStop(1,"rgba(160,20,32,0)");
    x.fillStyle=g;x.fillRect(f.x,f.y,f.w,LH*.16);
  });
  embers.forEach(function(p){
    p.y-=p.v*dt/16.7;p.x+=Math.sin(ts/1300+p.ph)*.3;
    if(p.y<LH*.28){p.y=LH;p.x=Math.random()*LW;}
    x.fillStyle="rgba(255,"+(70+Math.round(60*Math.abs(Math.sin(ts/400+p.ph))))+",40,.5)";
    x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();
  });
  if(ltOn>0){ltOn-=dt;x.fillStyle="rgba(255,40,52,"+(0.1*Math.max(0,ltOn)/130).toFixed(3)+")";x.fillRect(0,0,LW,LH);}
  else{ltCd-=dt;if(ltCd<=0){ltOn=130;ltCd=R(9000,17000);}}
}
/* цикл: 30 fps + спит, пока фон не БАКАЛА */
function frame(ts){
  rafId=0;
  if(!act()){loopOn=false;sc.style.display="none";sp.style.display="none";return;}
  if(!last)last=ts;var dt=Math.min(50,ts-last);last=ts;
  next-=dt;
  if(next<=0){spawn();next=R(8000,20000);}
  if(ts-lastDraw>=33){
    lastDraw=ts;
    drawScene(ts,dt);
    drawSpirits(ts,dt);
  }
  rafId=requestAnimationFrame(frame);
}
setInterval(function(){
  var on=act();
  if(on&&!loopOn){
    loopOn=true;last=0;lastDraw=0;
    sc.style.display="block";sp.style.display="block";
    var b=document.getElementById("bgc");if(b)b.style.display="none";
    rafId=requestAnimationFrame(frame);
  }else if(!on){
    sc.style.display="none";sp.style.display="none";
    if(loopOn){loopOn=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;}
  }
},500);

/* ловля духов — награды ТОЛЬКО здесь, никаких выдач при надевании фона */
document.addEventListener("click",function(e){
  if(!act()||huntBusy)return;
  for(var i=sh.length-1;i>=0;i--){
    var g=sh[i],dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(dx*dx+dy*dy<52*52){
      sh.splice(i,1);
      bursts.push({x:g.x,y:g.y,t:0,r0:R(0,6.3)});
      var today=new Date().toDateString();
      if(G().bakDay!==today){G().bakDay=today;G().bakCaught=0;G().bakMute=0;}
      if(!G().bakCaught)G().bakCaught=0;
      if(G().bakCaught>=5){
        if(!G().bakMute){G().bakMute=1;toast("👁 БАКАЛА молчит — духи не отдают больше ничего до завтра");}
        return;
      }
      huntBusy=true;
      G().bakCaught++;
      try{if(navigator.vibrate)navigator.vibrate(25);}catch(e){}
      if(G().bakCaught>=5){
        giveBox("legendary",1);
        var fl=document.createElement("div");
        fl.style.cssText="position:fixed;inset:0;z-index:9990;background:rgba(255,20,30,.22);opacity:0;pointer-events:none;transition:opacity .15s";
        document.body.appendChild(fl);
        requestAnimationFrame(function(){fl.style.opacity="1";setTimeout(function(){fl.style.opacity="0";setTimeout(function(){fl.remove();},260);},240);});
        setTimeout(function(){roar();toast("💀 ДАР БАКАЛА: легендарный ящик! Завтра духи снова выйдут на охоту");},650);
      }else{
        var n=3+Math.floor(Math.random()*6);
        addTok(n);
        toast("👁 Тень поймана: +"+n+" 🪙 ("+G().bakCaught+"/5)");
      }
      save();
      setTimeout(function(){huntBusy=false;},320);
      return;
    }
  }
},true);
/* --- чистка кэша: старые копии больше не подсунутся --- */
try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{r.unregister();}catch(e2){}});});}catch(e){}
try{if(window.caches&&caches.keys)caches.keys().then(function(ks){ks.forEach(function(k){try{caches.delete(k);}catch(e2){}});});}catch(e){}
}catch(e){}})();
